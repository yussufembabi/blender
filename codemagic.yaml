workflows:
  blender_ios_device:
    name: Blender iOS device first build
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        BUILD_DIR: build-ios-device
        GIT_LFS_SKIP_SMUDGE: "1"
    scripts:
      - name: Show environment
        script: |
          set -euxo pipefail
          pwd
          git branch --show-current
          git rev-parse --short HEAD
          xcodebuild -version
          cmake --version
      - name: Fetch real LFS files (skip broken test assets)
        script: |
          set -euxo pipefail
          cd "$CM_BUILD_DIR"
          git lfs install
          git lfs pull --exclude="tests/**"
      - name: Pin to commit matching iOS libs
        script: |
          set -euxo pipefail
          cd "$CM_BUILD_DIR"
          LIBS_COMMIT=$(git log -1 --format=%H -- lib/ios_arm64)
          echo "Commit that last updated lib/ios_arm64 pointer: $LIBS_COMMIT"
          git checkout "$LIBS_COMMIT"
      - name: Force-fetch iOS + macOS precompiled libs
        script: |
          set -euxo pipefail
          cd "$CM_BUILD_DIR"
          git -c submodule.lib/ios_arm64.update=checkout \
              -c submodule.lib/macos_arm64.update=checkout \
              submodule update --init --recursive -- lib/ios_arm64 lib/macos_arm64
          (cd lib/ios_arm64 && git lfs install && git lfs pull)
          (cd lib/macos_arm64 && git lfs install && git lfs pull)
      - name: Configure Blender for iOS device
        script: |
          set -euxo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/sbin:/usr/bin:/bin:$PATH"
          rm -rf "$CM_BUILD_DIR/$BUILD_DIR"
          cmake \
            -S "$CM_BUILD_DIR" \
            -B "$CM_BUILD_DIR/$BUILD_DIR" \
            -G Xcode \
            -DAPPLE_TARGET_DEVICE=ios
      - name: Build Blender
        script: |
          set -euxo pipefail
          cmake --build "$CM_BUILD_DIR/$BUILD_DIR" \
            --config Release \
            --parallel 8 \
            -- CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package IPA
        script: |
          set -euxo pipefail
          cd "$CM_BUILD_DIR/$BUILD_DIR/bin/Release"
          LIBDIR="$CM_BUILD_DIR/lib/ios_arm64"
          mkdir -p Blender.app/Assets/lib
          cp -v "$LIBDIR"/tbb/lib/libtbb.dylib \
                "$LIBDIR"/tbb/lib/libtbbmalloc_proxy.dylib \
                "$LIBDIR"/tbb/lib/libtbbmalloc.dylib \
                "$LIBDIR"/openmp/lib/libomp.dylib \
                Blender.app/Assets/lib/
          cp -v "$LIBDIR"/imath/lib/*.dylib Blender.app/Assets/lib/ 2>/dev/null || echo "no imath dylibs found"
          cp -v "$LIBDIR"/llvm/lib/*.dylib Blender.app/Assets/lib/ 2>/dev/null || echo "no llvm dylibs found"
          cp -v "$LIBDIR"/openimageio/lib/*.dylib Blender.app/Assets/lib/ 2>/dev/null || echo "no openimageio dylibs found"
          echo "--- Final Assets/lib contents ---"
          ls -la Blender.app/Assets/lib/
          rm -rf Payload
          mkdir -p Payload
          cp -R Blender.app Payload/
          zip -r -y Blender.ipa Payload
          ls -la Blender.ipa
    artifacts:
      - build-ios-device/bin/Release/Blender.ipa
      - build-ios-device/bin/Release/Blender.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
      - /tmp/xcodebuild_logs/*.log
