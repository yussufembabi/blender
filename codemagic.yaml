workflows:
  blender_ios_device:
    name: Blender iOS device build (official recipe)
    max_build_duration: 180
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        BUILD_DIR: build_ios
    scripts:
      - name: Install dependencies
        script: |
          set -euxo pipefail
          brew install git-lfs cmake || true

      - name: Clone Blender ios branch with LFS
        script: |
          set -euxo pipefail
          git lfs install
          rm -rf blender
          git clone --depth 1 --branch ios https://projects.blender.org/blender/blender.git blender
          cd blender
          git lfs fetch origin
          git lfs pull

      - name: Fetch prebuilt iOS libraries (official method)
        script: |
          set -euxo pipefail
          cd blender
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/sbin:/usr/bin:/bin:$PATH"
          python3 build_files/utils/make_update.py --use-ios-libraries

      - name: Generate Xcode project
        script: |
          set -euxo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/sbin:/usr/bin:/bin:$PATH"
          cmake -G Xcode -S blender -B $BUILD_DIR

      - name: Build cross-compilation tools
        script: |
          set -euxo pipefail
          xcodebuild \
            -project $BUILD_DIR/Blender.xcodeproj \
            -target blender_cross_tools_compile \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Blender.app for iOS (install target)
        script: |
          set -euxo pipefail
          xcodebuild \
            -project $BUILD_DIR/Blender.xcodeproj \
            -target install \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64

      - name: Package unsigned IPA
        script: |
          set -euxo pipefail
          APP="$BUILD_DIR/bin/Release/Blender.app"
          ls -la "$APP" || (echo "App not found, searching..." && find "$BUILD_DIR" -name "*.app" -type d)
          du -sh "$APP"
          mkdir -p IPA/Payload
          cp -r "$APP" IPA/Payload/
          cd IPA && zip -r ../Blender.ipa Payload/
          ls -lh ../Blender.ipa

    artifacts:
      - Blender.ipa
      - $BUILD_DIR/**/*.log
