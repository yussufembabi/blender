workflows:
  blender_ios_device:
    name: Blender iOS device first build
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        BUILD_DIR: build-ios-device
        GIT_LFS_SKIP_SMUDGE: "1"
    scripts:
      - name: Show environment
        script: |
          set -euxo pipefail
          pwd
          git branch --show-current
          git rev-parse --short HEAD
          xcodebuild -version
          cmake --version
      - name: Fetch real LFS files (skip broken test assets)
        script: |
          set -euxo pipefail
          cd "$CM_BUILD_DIR"
          git lfs install
          git lfs pull --exclude="tests/**"
      - name: Force-fetch iOS device precompiled libs
        script: |
          set -euxo pipefail
          cd "$CM_BUILD_DIR"
          git -c submodule.lib/ios_arm64.update=checkout submodule update --init --recursive -- lib/ios_arm64
          echo "--- Contents of lib/ios_arm64 ---"
          ls -la lib/ios_arm64/
      - name: Configure Blender for iOS device
        script: |
          set -euxo pipefail
          rm -rf "$CM_BUILD_DIR/$BUILD_DIR"
          cmake \
            -S "$CM_BUILD_DIR" \
            -B "$CM_BUILD_DIR/$BUILD_DIR" \
            -G Xcode \
            -DAPPLE_TARGET_DEVICE=ios
      - name: Build Blender
        script: |
          set -euxo pipefail
          cmake --build "$CM_BUILD_DIR/$BUILD_DIR" \
            --config Release \
            --parallel 8
    artifacts:
      - build-ios-device/**/*
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
      - /tmp/xcodebuild_logs/*.log
